# Cloudflare Worker for the retired docs subdomain (apps/docs).
#
# The documentation now lives at docvia.dev/docs (apps/web). This worker keeps
# docs.docvia.dev alive as a permanent redirect so existing links and search
# results still resolve. There is no build step — wrangler bundles src/index.ts.
#
# Deployment is via .github/workflows/deploy-docs-site.yml.

name = "docvia-docs"
main = "src/index.ts"
compatibility_date = "2026-01-01"

observability = { enabled = true }

# When you connect a custom domain, uncomment and set zone_name:
# [[routes]]
# pattern = "docs.docvia.dev"
# custom_domain = true
