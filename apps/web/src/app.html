<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0d0d11" />
		<script>
			// Inline theme bootstrap — runs before paint to avoid a flash.
			(() => {
				try {
					const stored = localStorage.getItem("docvia-theme");
					const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
					const theme = stored ?? (prefersDark ? "dark" : "light");
					document.documentElement.setAttribute("data-theme", theme);
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-fg antialiased scrollbar-transparent">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
