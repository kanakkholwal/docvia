<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#16171d" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/satoshi-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Inline theme bootstrap, runs before paint to avoid a flash. Dark is
			// the canonical theme; light is opt-in via the toggle only.
			(() => {
				try {
					const stored = localStorage.getItem("docvia-theme");
					document.documentElement.setAttribute("data-theme", stored ?? "dark");
					// Scroll reveals only hide content when JS can un-hide it.
					document.documentElement.classList.add("js");
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-fg antialiased scrollbar-transparent">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
