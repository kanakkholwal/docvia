# Cloudflare Worker config for the docvia marketing site (apps/web).
#
# Built output is produced by @sveltejs/adapter-cloudflare into
# .svelte-kit/cloudflare/. Wrangler ships the _worker.js entry plus the
# static assets in the same directory.
#
# Deployment is manual via .github/workflows/deploy-web.yml
# (workflow_dispatch). There is no Git-connected auto-deploy.

name = "docvia-web"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Tail logs on production for the first weeks of public preview.
observability = { enabled = true }

# Served only on the custom domain; www.docvia.dev 301s here via a zone Redirect Rule.
workers_dev = false
preview_urls = false

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[routes]]
pattern = "docvia.dev"
custom_domain = true
