name: Deploy docs redirect

# Deploys the redirect-only worker on docs.docvia.dev. The docs themselves
# ship with apps/web (see deploy-web.yml).
on:
   push:
      branches:
        - main
      paths:
        - 'apps/docs/**'  # Only trigger if changes in this directory
   workflow_dispatch:
      
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-docs-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to CF Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment }}
      url: https://docs.docvia.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4.x requires Node >= 22.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build step: wrangler bundles apps/docs/src/index.ts directly.
      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: >-
            deploy
            ${{ inputs.environment != '' && format('--env {0}', inputs.environment) || '' }}
