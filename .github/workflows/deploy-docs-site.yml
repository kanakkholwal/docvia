name: Deploy docs

# Manual-only. There is intentionally no `push:` or `pull_request:` trigger
# — Cloudflare deploys are gated behind a human pressing "Run workflow"
# in the GitHub UI (or via `gh workflow run deploy-docs-site.yml`).
on:
   push:
      branches:
        - main
      paths:
        - 'apps/docs/**'  # Only trigger if changes in this directory
   workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (e.g., production, staging). Leave blank for default.'
        required: false
        default: ''
      
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-docs-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy apps/docs to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment }}
      url: https://docs.docvia.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/docs
        # Build through Turbo so workspace dependencies (@docvia/cli, etc.)
        # are compiled first — apps/docs' `prebuild` hook runs `docvia build`,
        # which needs @docvia/cli's dist/index.mjs to exist.
        run: pnpm turbo run build --filter=@docvia/docs

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: >-
            deploy
            ${{ inputs.environment != '' && format('--env {0}', inputs.environment) || '' }}
