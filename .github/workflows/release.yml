name: Release

on:
  push:
    branches:
      - main
    # Match version tags like v1.2.3
    paths:
      - "apps/packages/**" # Only trigger if changes in this directory
  workflow_dispatch: # Allow manual triggering from the Actions tab


concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    # Only run on the canonical repository to avoid forks accidentally publishing.
    if: github.repository == 'kanakkholwal/docvia'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump PR / tags
      pull-requests: write
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
