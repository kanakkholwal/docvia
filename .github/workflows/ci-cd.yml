name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so changesets status can compare against the base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Type-check apps from a cold .docvia
        # `docvia sync` writes the types without Vite, as on a fresh checkout.
        run: pnpm --filter demo-svelte --filter @docvia/web check

      - name: Pack and install outside the workspace
        # Strict pnpm (hoist=false), SvelteKit 3, Workers build, from the packed tarballs.
        run: node scripts/pack-smoke.mjs

      - name: Verify changeset on PRs
        # Surface a comment if a PR ships code without a changeset. Doesn't fail
        # the build — some PRs (docs-only, CI-only) legitimately don't need one.
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main || true
